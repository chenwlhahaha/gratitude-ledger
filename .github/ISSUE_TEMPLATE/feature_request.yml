name: 功能建议
description: 提议一个新功能或改进现有体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明"要解决的问题"，再谈具体方案。这个项目刻意保持轻量：单进程、零运行时依赖、JSON 存储，方案越简单越容易合并。

        **隐私提醒**：请勿包含真实姓名、家书内容、登录码或部署信息。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不好用？谁在什么场景下会遇到？
      placeholder: 例如：每月导出后还要手工算各组的平均收益，班长需要额外花半小时。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望的交互或输出是什么？可选地给出接口/数据字段设想。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过的？为什么不采用其他做法？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 仅前端展示
        - 新增 / 修改接口
        - 数据结构（需要迁移）
        - 权限模型
        - 部署 / 运维
        - 文档
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: 主要受益者
      multiple: true
      options:
        - 组员
        - 组长 / 辅导员
        - 班委 / 班主任
        - 部署维护者
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 原型图、参考产品、相关 Issue 等（请脱敏）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有找到相同建议。
          required: true
        - label: 本建议不包含任何真实学员数据或部署凭据。
          required: true
